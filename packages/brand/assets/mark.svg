<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" role="img" aria-label="Sonari">
  <!--
    The Sonari mark: an S drawn as one continuous stroke with round terminals,
    so it reads as something spoken rather than something typed.

    An earlier version traced the S from two large circular arcs, on the theory
    that the geometry doubled as a "sound radiating" glyph. Rendered at 16, 26
    and 64 px side by side it read as a curl, not a letter — the arcs were
    sweeping far enough to close into a blob. A legible letter beats a clever
    one that nobody can parse in a browser tab; the character now comes from
    the stroke weight, the round caps, and the spectrum gradient.

    Stroked rather than filled so one path holds at every size with no separate
    small cut. mark-mono.svg is the single-colour version for app chrome, per
    docs/branding.md.
  -->
  <defs>
    <linearGradient id="sonari-spectrum" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1b1740" />
      <stop offset="32%" stop-color="#3a3a95" />
      <stop offset="58%" stop-color="#2f7f9b" />
      <stop offset="84%" stop-color="#d99b4a" />
      <stop offset="100%" stop-color="#f4e6c9" />
    </linearGradient>
  </defs>
  <path
    d="M22 10.2C22 7.4 19.2 5.8 16 6.4C12.6 7 11 9.8 13.2 11.8C15.4 13.8 20 14 21.6 16.4C23.2 18.8 21 22.2 17.2 22.8C13.8 23.4 10 22 10 19"
    fill="none"
    stroke="url(#sonari-spectrum)"
    stroke-width="3.4"
    stroke-linecap="round"
  />
</svg>
