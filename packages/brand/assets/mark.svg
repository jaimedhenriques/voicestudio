<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" role="img" aria-label="Sonari">
  <!--
    The Sonari mark: an S traced by two point-symmetric arcs.

    Each arc is a ~224° sweep — the same geometry used to draw a sound wave
    radiating from a source — so the monogram and the "emitting" reading are
    the same line. Stroked rather than filled so it holds its weight from
    16px to 512px without a separate small-size cut.

    Renders in the spectrum gradient here; `mark-mono.svg` is the
    single-colour cut for app chrome, per docs/branding.md's rule that the
    mark may render in one colour inside chrome.
  -->
  <defs>
    <linearGradient id="sonari-spectrum" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1b1740" />
      <stop offset="32%" stop-color="#3a3a95" />
      <stop offset="58%" stop-color="#2f7f9b" />
      <stop offset="84%" stop-color="#d99b4a" />
      <stop offset="100%" stop-color="#f4e6c9" />
    </linearGradient>
  </defs>
  <path
    d="M23 9A5.35 5.35 0 1 0 16 16A5.35 5.35 0 1 0 9 23"
    fill="none"
    stroke="url(#sonari-spectrum)"
    stroke-width="3.6"
    stroke-linecap="round"
  />
</svg>
